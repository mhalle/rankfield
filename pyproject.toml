[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rankfield"
version = "0.3.2"
description = "rankfield: a per-class field kept as ranks - the encoding, its decoders, and the restore"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.7"]           # encode, decode_groups and the restore's blend run on torch
cuda = ["triton>=3.0"]           # the CUDA restore kernel; enable_fp_fusion must exist as a launch option
store = ["zarr>=3.3"]            # read/write the portable store (writing also needs duckn, from GitHub)
test = ["pytest>=8", "torch>=2.7", "zarr>=3.3"]

# The store WRITER needs duckn, which is not on PyPI - so the `test` extra cannot carry it
# without making `pip install rankfield[test]` unresolvable. A dependency group is dev-only
# and never reaches the published metadata, and `uv sync` installs it by default. Without it
# the four store tests SKIP rather than fail, and a green run says nothing about the writer.
[dependency-groups]
dev = ["duckn>=0.3"]

[tool.uv.sources]
duckn = { git = "https://github.com/mhalle/duckn.git", tag = "v0.3.2" }

[tool.hatch.build.targets.wheel]
packages = ["src/rankfield"]

[tool.ruff]
line-length = 110
